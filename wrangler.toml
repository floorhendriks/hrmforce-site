[[d1_databases]]
binding = "DB"
database_name = "hrmforce-orders"
database_id = "e8d09d24-18f4-41f2-98e6-ab73f9244490"

# De functieprofiel-pdf's (450 profielen x 6 talen, ongeveer 1,2 GB) staan hier en niet
