<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-label="Voorbeeld van het vraagscherm van de hrmforce vragenlijst">
  <rect width="1200" height="760" fill="#EEF3F9"/>
  <!-- top bar -->
  <rect x="0" y="0" width="1200" height="72" fill="#FFFFFF"/>
  <rect x="0" y="71" width="1200" height="1" fill="#E2E8F0"/>
  <text x="48" y="46" font-size="24" font-weight="800" fill="#0B2545">hrm<tspan fill="#C8A63E">force</tspan></text>
  <text x="1152" y="44" text-anchor="end" font-size="15" fill="#6B7A90">Vraag 8 van 30</text>
  <!-- progress -->
  <rect x="0" y="72" width="1200" height="6" fill="#E7EDF4"/>
  <rect x="0" y="72" width="320" height="6" fill="#C8A63E"/>
  <!-- question card -->
  <rect x="240" y="150" width="720" height="470" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="290" cy="212" r="20" fill="#0B2545"/>
  <text x="290" y="219" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">8</text>
  <text x="330" y="200" font-size="14" font-weight="700" letter-spacing="1" fill="#C8A63E">PERSOONLIJKHEID</text>
  <text x="290" y="285" font-size="26" font-weight="700" fill="#1F2D45">Ik voel me op mijn gemak in een</text>
  <text x="290" y="320" font-size="26" font-weight="700" fill="#1F2D45">groep onbekende mensen.</text>
  <text x="290" y="366" font-size="15" fill="#6B7A90">Geef aan in hoeverre deze stelling bij je past.</text>
  <!-- likert scale 5 options -->
  <g>
    <rect x="290" y="410" width="120" height="150" rx="12" fill="#F6F8FB" stroke="#E2E8F0"/>
    <rect x="428" y="410" width="120" height="150" rx="12" fill="#F6F8FB" stroke="#E2E8F0"/>
    <rect x="566" y="410" width="120" height="150" rx="12" fill="#FBF4E1" stroke="#C8A63E" stroke-width="2"/>
    <rect x="704" y="410" width="120" height="150" rx="12" fill="#F6F8FB" stroke="#E2E8F0"/>
    <rect x="842" y="410" width="120" height="150" rx="12" fill="#F6F8FB" stroke="#E2E8F0"/>
    <circle cx="350" cy="460" r="15" fill="#FFFFFF" stroke="#B7C2D0" stroke-width="2"/>
    <circle cx="488" cy="460" r="15" fill="#FFFFFF" stroke="#B7C2D0" stroke-width="2"/>
    <circle cx="626" cy="460" r="15" fill="#C8A63E" stroke="#C8A63E" stroke-width="2"/>
    <path d="M619 460 l5 5 l9 -10" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="764" cy="460" r="15" fill="#FFFFFF" stroke="#B7C2D0" stroke-width="2"/>
    <circle cx="902" cy="460" r="15" fill="#FFFFFF" stroke="#B7C2D0" stroke-width="2"/>
    <text x="350" y="515" text-anchor="middle" font-size="13" fill="#6B7A90">Helemaal</text>
    <text x="350" y="532" text-anchor="middle" font-size="13" fill="#6B7A90">oneens</text>
    <text x="488" y="524" text-anchor="middle" font-size="13" fill="#6B7A90">Oneens</text>
    <text x="626" y="524" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2D45">Neutraal</text>
    <text x="764" y="524" text-anchor="middle" font-size="13" fill="#6B7A90">Eens</text>
    <text x="902" y="515" text-anchor="middle" font-size="13" fill="#6B7A90">Helemaal</text>
    <text x="902" y="532" text-anchor="middle" font-size="13" fill="#6B7A90">eens</text>
  </g>
  <!-- nav buttons -->
  <rect x="240" y="656" width="140" height="52" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="310" y="689" text-anchor="middle" font-size="16" font-weight="600" fill="#475569">Vorige</text>
  <rect x="820" y="656" width="140" height="52" rx="12" fill="#C8A63E"/>
  <text x="890" y="689" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Volgende</text>
</svg>
