<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-label="Die vier Präferenzpaare des MBTI: Extraversion oder Introversion, Sensing oder Intuition, Thinking oder Feeling, Judging oder Perceiving. Vier Entscheidungen ergeben sechzehn Typen.">
  <style>
    .t  { font-family: "IBM Plex Sans", Arial, sans-serif; }
    .kop{ font-family: Archivo, "Arial Narrow", Arial, sans-serif; font-weight: 700; }
  </style>
  <rect width="900" height="490" fill="#ffffff"/>
  <rect x="0" y="0" width="900" height="6" fill="#0e468c"/>

  <text class="kop" x="48" y="62" font-size="23" fill="#0e468c">Die vier Präferenzpaare des MBTI</text>
  <text class="t" x="48" y="90" font-size="15" fill="#5a6b7b">Pro Paar wählen Sie eine Seite. Vier Entscheidungen ergeben sechzehn Typen.</text>

  <g class="t" font-size="16" fill="#26313d">
    <rect x="48" y="122" width="390" height="54" fill="#eef3fa" stroke="#e3eaf2"/>
    <rect x="438" y="122" width="390" height="54" fill="#ffffff" stroke="#e3eaf2"/>
    <rect x="435" y="114" width="6" height="70" fill="#d95d15"/>
    <text x="72" y="155" font-weight="600" fill="#0e468c">Extraversion</text>
    <text x="462" y="155" font-weight="600">Introversion</text>
    <text x="852" y="155" text-anchor="end" font-size="12.5" fill="#5a6b7b">worauf Sie achten</text>

    <rect x="48" y="196" width="390" height="54" fill="#eef3fa" stroke="#e3eaf2"/>
    <rect x="438" y="196" width="390" height="54" fill="#ffffff" stroke="#e3eaf2"/>
    <rect x="435" y="188" width="6" height="70" fill="#d95d15"/>
    <text x="72" y="229" font-weight="600" fill="#0e468c">Sensing</text>
    <text x="462" y="229" font-weight="600">Intuition</text>
    <text x="852" y="229" text-anchor="end" font-size="12.5" fill="#5a6b7b">wie Sie Informationen aufnehmen</text>

    <rect x="48" y="270" width="390" height="54" fill="#eef3fa" stroke="#e3eaf2"/>
    <rect x="438" y="270" width="390" height="54" fill="#ffffff" stroke="#e3eaf2"/>
    <rect x="435" y="262" width="6" height="70" fill="#d95d15"/>
    <text x="72" y="303" font-weight="600" fill="#0e468c">Thinking</text>
    <text x="462" y="303" font-weight="600">Feeling</text>
    <text x="852" y="303" text-anchor="end" font-size="12.5" fill="#5a6b7b">worauf Sie Entscheidungen stützen</text>

    <rect x="48" y="344" width="390" height="54" fill="#eef3fa" stroke="#e3eaf2"/>
    <rect x="438" y="344" width="390" height="54" fill="#ffffff" stroke="#e3eaf2"/>
    <rect x="435" y="336" width="6" height="70" fill="#d95d15"/>
    <text x="72" y="377" font-weight="600" fill="#0e468c">Judging</text>
    <text x="462" y="377" font-weight="600">Perceiving</text>
    <text x="852" y="377" text-anchor="end" font-size="12.5" fill="#5a6b7b">wie Sie Dinge abschließen</text>
  </g>

  <rect x="48" y="428" width="46" height="3" fill="#fcc11b"/>
  <line x1="48" y1="429.5" x2="852" y2="429.5" stroke="#e3eaf2" stroke-width="1"/>
  <text class="t" x="48" y="453" font-size="13.5" fill="#5a6b7b">Die Trennung in der Mitte ist hart: eine Zwischenposition gibt es nicht. Ein Big-Five-Fragebogen misst</text>
  <text class="t" x="48" y="472" font-size="13.5" fill="#5a6b7b">dieselben Themen auf einer durchgehenden Skala.</text>
</svg>
